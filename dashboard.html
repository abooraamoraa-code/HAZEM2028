<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المركزية - إدارة وتطوير أبو العز العمري</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #020617; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        aside { width: 260px; background: #0f172a; border-left: 1px solid #1e293b; padding: 20px; }
        .logo { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 30px; text-align: center; }
        nav a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; background: #1e293b; color: #38bdf8; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        h1 { color: #38bdf8; margin-bottom: 10px; font-size: 24px; }
        .panel-box { background: #0f172a; border: 1px solid #1e293b; padding: 25px; border-radius: 12px; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #fff; }
        button { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <aside>
        <div class="logo">🛡️ أبو العز العمري</div>
        <nav><a href="#">📊 الرئيسية وإدارة Adsterra</a></nav>
    </aside>
    <main>
        <h1>لوحة التحكم المركزية الآمنة</h1>
        <p style="color: #64748b;">النظام يعمل بكفاءة تامة وتحت حماية كاملة.</p>
        <div class="panel-box">
            <h3>🚀 ربط والتحكم بأكواد إعلانات Adsterra</h3>
            <form id="adForm">
                <div class="form-group"><label>اسم المساحة (Zone Name)</label><input type="text" id="zoneName" required></div>
                <div class="form-group"><label>كود الإعلان (HTML / Script)</label><textarea id="adCode" rows="4" required></textarea></div>
                <button type="submit">حفظ وتفعيل الإعلان</button>
            </form>
            <div id="adMsg" style="margin-top: 10px; font-size: 13px;"></div>
        </div>
    </main>
    <script>
        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const zoneName = document.getElementById('zoneName').value;
            const adCode = document.getElementById('adCode').value;
            const msgBox = document.getElementById('adMsg');
            try {
                const res = await fetch('/secret-portal-x99/api/ads/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zoneName, adCode, isActive: true })
                });
                const data = await res.json();
                msgBox.style.color = res.ok ? '#22c55e' : '#ef4444';
                msgBox.innerText = data.message || data.error;
            } catch(err) {
                msgBox.style.color = '#ef4444';
                msgBox.innerText = '❌ خطأ في الاتصال.';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق البث المباشر - إدارة وتطوير أبو العز العمري</title>
    <!-- استدعاء ملف التصميم الخارجي ومشغل الفيديو -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">⚽ بث مباشر - إدارة وتطوير أبو العز العمري</div>
        <div>
            <a href="/secret-portal-x99/admin-master-v1" class="admin-link">🔐 لوحة التحكم</a>
        </div>
    </header>

    <div class="main-container">
        
        <!-- مشغل البث المباشر -->
        <div class="player-wrapper">
            <video id="liveTVPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                <p class="vjs-no-js">اختر مباراة لبدء البث الفوري.</p>
            </video>
            <div class="current-match-info">
                <div>
                    <span id="nowPlayingTitle" style="font-weight: bold; font-size: 16px;">اختر مباراة للمشاهدة</span>
                    <p style="margin: 3px 0 0; font-size: 12px; color: #94a3b8;" id="nowPlayingLeague">بث فضائي مباشر عبر الـ API</p>
                </div>
                <div class="live-badge">🔴 مباشر حصرياً</div>
            </div>
        </div>

        <!-- مساحة إعلانات Adsterra -->
        <div class="ads-container">
            <p>📢 مساحة إعلانية ذكية (Adsterra Banner)</p>
        </div>

        <!-- جدول المباريات الحية يتم تحميله آلياً -->
        <h3 class="section-title">📅 جدول المباريات الحية المربوطة بالأقمار الصناعية</h3>
        <div class="matches-grid" id="matchesGrid">
            <!-- سيتم تحميل المباريات هنا تلقائياً بواسطة appScript.js -->
        </div>

    </div>

    <footer>
        <p>جميع حقوق البث والتطوير محفوظة © 2026 - إدارة وتطوير أبو العز العمري</p>
    </footer>

    <!-- استدعاء ملفات السكربت الخارجية -->
    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script src="appScript.js"></script>
</body>
</html>
